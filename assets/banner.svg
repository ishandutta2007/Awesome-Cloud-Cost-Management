<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.2px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .stat-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 22px; fill: #f8fafc; }
    .stat-lbl { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    .pulsing-orb-1 { animation: pulseGlow 6s infinite ease-in-out; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseGlow 8s infinite ease-in-out 1s; transform-origin: 1000px 220px; }
    .flowing-line { stroke-dasharray: 8, 8; animation: dashMove 3s linear infinite; }
    .animated-card-1 { animation: floatCard 5s ease-in-out infinite; }
    .animated-card-2 { animation: floatCard 6s ease-in-out infinite 1.5s; }
  </style>

  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <g opacity="0.05">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1"/>
  </g>

  <circle class="pulsing-orb-1" cx="180" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <circle class="pulsing-orb-2" cx="1020" cy="240" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="160" r="220" fill="#c084fc" opacity="0.06" filter="url(#glow)"/>

  <g opacity="0.25">
    <path d="M750 240 Q 820 180, 880 210 T 1000 130 T 1150 90" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glowLight)"/>
    <path class="flowing-line" d="M750 240 Q 820 180, 880 210 T 1000 130 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <g transform="translate(60, 0)">
    <g transform="translate(0, 48)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#glowLight)"/>
      <text x="28" y="20" class="badge-text">FINOPS &amp; CLOUD COST</text>
    </g>

    <text x="0" y="130" class="title">
      Awesome <tspan fill="url(#accentGrad)">Cloud Cost</tspan> Management
    </text>

    <text x="0" y="168" class="subtitle">
      Curated FinOps Ecosystem • Multi-Cloud &amp; Kubernetes Optimization • Open Source &amp; SaaS
    </text>

    <g transform="translate(0, 204)">
      <g class="animated-card-1">
        <rect width="160" height="64" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1"/>
        <text x="16" y="32" class="stat-val">$24.5B+</text>
        <text x="16" y="48" class="stat-lbl">2032 FinOps Market</text>
      </g>

      <g transform="translate(176, 0)" class="animated-card-2">
        <rect width="160" height="64" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1"/>
        <text x="16" y="32" class="stat-val">FOCUS 1.0</text>
        <text x="16" y="48" class="stat-lbl">Open Billing Spec</text>
      </g>

      <g transform="translate(352, 0)">
        <rect width="170" height="64" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1"/>
        <text x="16" y="32" class="stat-val" fill="#38bdf8">AWS / K8s / GCP</text>
        <text x="16" y="48" class="stat-lbl">Multi-Cloud Support</text>
      </g>
    </g>
  </g>

  <g transform="translate(840, 50)" class="animated-card-1" opacity="0.9">
    <rect width="280" height="190" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" filter="url(#glowLight)"/>
    <path d="M0 14 C0 6.268 6.268 0 14 0 H266 C273.732 0 280 6.268 280 14 V36 H0 V14 Z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#eab308"/>
    <circle cx="52" cy="18" r="5" fill="#22c55e"/>
    <text x="260" y="22" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">finops.json</text>

    <text x="20" y="65" font-family="monospace" font-size="12" fill="#38bdf8">{</text>
    <text x="35" y="85" font-family="monospace" font-size="12" fill="#94a3b8">"optimization": <tspan fill="#22c55e">"automated"</tspan>,</text>
    <text x="35" y="105" font-family="monospace" font-size="12" fill="#94a3b8">"idle_resources": <tspan fill="#ef4444">"terminated"</tspan>,</text>
    <text x="35" y="125" font-family="monospace" font-size="12" fill="#818cf8">"94.2%"</tspan>,</text>
    <text x="35" y="145" font-family="monospace" font-size="12" fill="#94a3b8">"monthly_savings": <tspan fill="#f59e0b">"$34,200"</tspan></text>
    <text x="20" y="165" font-family="monospace" font-size="12" fill="#38bdf8">}</text>
  </g>

  <rect x="0" y="316" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
